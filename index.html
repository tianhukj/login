<!DOCTYPE html>
<html>
<head>
    <title>My Awesome App - Login/Register</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link your CSS file for styling -->
    <link rel="stylesheet" href="style.css">

    <!-- If you use FirebaseUI, include its CSS -->
    <!-- Check the FirebaseUI documentation for the latest URL -->
    <!-- <link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.0.1/firebase-ui-auth.css" /> -->


</head>
<body>

    <h1>Welcome to My App!</h1>
    <p>Please sign in or register to continue.</p>

    <!--
      This is where your authentication UI will go.
      - If using FirebaseUI, FirebaseUI will render forms inside this div.
      - If building custom UI, you will put your own HTML forms (for login, registration, etc.) here.
    -->
    <div id="auth-container">
        <!-- Example placeholders if building custom UI: -->
        <!--
        <form id="login-form">
            <h2>Sign In</h2>
            <input type="email" id="login-email" placeholder="Email" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button type="submit">Sign In</button>
            <p><a href="#" id="show-register">Need an account? Register here.</a></p>
        </form>

        <form id="register-form" style="display: none;">
             <h2>Register</h2>
            <input type="email" id="register-email" placeholder="Email" required>
            <input type="password" id="register-password" placeholder="Password" required>
            <button type="submit">Register</button>
            <p><a href="#" id="show-login">Already have an account? Sign In.</a></p>
        </form>
        -->
    </div>

    <!--
        Optional area to show user info once logged in.
        You would show/hide this based on the user's authentication state.
    -->
    <div id="user-info" style="display: none;">
        <h2>Welcome, <span id="user-display-name"></span>!</h2>
        <p>You are logged in with email: <span id="user-email"></span></p>
        <button id="sign-out-button">Sign Out</button>
    </div>

    <!-- The core Firebase JS SDK is always required and must be listed first -->
    <!-- **IMPORTANT:** Get the LATEST script tags from your Firebase Project Settings > Your Apps > Select your web app > Firebase SDK snippet (Config) -->
    <!-- Example versions (these might be older, always check the console): -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>

    <!-- Add Firebase products you want to use -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>

    <!-- If you use FirebaseUI, include its JS -->
    <!-- Check the FirebaseUI documentation for the latest URL -->
    <!-- <script src="https://www.gstatic.com/firebasejs/ui/6.0.1/firebase-ui-auth.js"></script> -->

    <!-- Link your own JavaScript file -->
    <script src="auth.js"></script>

</body>
</html>
